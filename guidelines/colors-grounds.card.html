<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{width:700px;height:150px;overflow:hidden}body{padding:20px 22px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:7px 8px}.sw b{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;display:block}.sw i{font-family:var(--font-body);font-style:normal;font-size:10px;letter-spacing:.02em;opacity:.75;display:block;margin-top:2px}.sw{border:1px solid rgba(20,18,14,.07)}</style></head><body><div class="row">
<div class="sw" style="background:var(--paper-100);color:var(--ink-900)"><b>lime-100</b><i>#FDFAF4</i></div><div class="sw" style="background:var(--paper-200);color:var(--ink-900)"><b>lime-200</b><i>#FBF7EF</i></div><div class="sw" style="background:var(--paper-300);color:var(--ink-900)"><b>lime-300</b><i>#F5EFE3</i></div><div class="sw" style="background:var(--paper-400);color:var(--ink-900)"><b>lime-400</b><i>#EBE2D2</i></div>
<div style="width:14px"></div>
<div class="sw" style="background:var(--ledger-100);color:var(--ink-900)"><b>stone-100</b><i>#F1F1EE</i></div><div class="sw" style="background:var(--ledger-200);color:var(--ink-900)"><b>stone-200</b><i>#E4E5E0</i></div><div class="sw" style="background:var(--ledger-300);color:var(--ink-900)"><b>stone-300</b><i>#CFD0CA</i></div><div class="sw" style="background:var(--ledger-400);color:var(--ink-900)"><b>stone-400</b><i>#B4B6AE</i></div><div class="sw" style="background:var(--ledger-ground);color:var(--paper-200)"><b>ground</b><i>#2A231C</i></div>
</div>
<p style="font:var(--type-annotation-sm);letter-spacing:var(--tracking-annotation);text-transform:uppercase;margin:12px 0 0;max-width:none">LIME = THE BRAND. STONE = SIZING, SHIPPING, ORDERS. NEVER MIXED.</p></body></html>
