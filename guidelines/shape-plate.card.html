<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{width:700px;height:210px;overflow:hidden}body{padding:20px 22px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:7px 8px}.sw b{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;display:block}.sw i{font-family:var(--font-body);font-style:normal;font-size:10px;letter-spacing:.02em;opacity:.75;display:block;margin-top:2px}</style></head><body><div style="display:flex;gap:var(--gutter-plate);align-items:flex-end">
<div><div style="width:104px;height:140px;background:var(--pigment-crimson);border:var(--border-plate) solid var(--paper-200);box-shadow:0 0 0 1px var(--paper-400)"></div><div style="font:var(--type-form-label);color:var(--text-muted);margin-top:8px">portrait 3:4</div></div>
<div><div style="width:160px;height:120px;background:var(--pigment-olive);border:var(--border-plate) solid var(--paper-200);box-shadow:0 0 0 1px var(--paper-400)"></div><div style="font:var(--type-form-label);color:var(--text-muted);margin-top:8px">landscape 4:3</div></div>
<div><div style="width:120px;height:120px;background:var(--pigment-water);border:var(--border-plate) solid var(--paper-200);box-shadow:0 0 0 1px var(--paper-400)"></div><div style="font:var(--type-form-label);color:var(--text-muted);margin-top:8px">square</div></div>
<div style="font:var(--type-annotation-sm);letter-spacing:var(--tracking-annotation);text-transform:uppercase;max-width:16ch;color:var(--text-muted);padding-bottom:26px">6PX OF PAPER, NOT A STROKE.</div>
</div></body></html>
