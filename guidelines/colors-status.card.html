<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{width:700px;height:120px;overflow:hidden}body{padding:20px 22px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:7px 8px}.sw b{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;display:block}.sw i{font-family:var(--font-body);font-style:normal;font-size:10px;letter-spacing:.02em;opacity:.75;display:block;margin-top:2px}</style></head><body><div class="row"><div class="sw" style="background:var(--status-stop);color:var(--paper-200)"><b>stop</b><i>red</i></div><div class="sw" style="background:var(--status-warm);color:var(--ink-900)"><b>warm</b><i>yellow</i></div><div class="sw" style="background:var(--status-calm);color:var(--paper-200)"><b>calm</b><i>water</i></div><div class="sw" style="background:var(--status-go);color:var(--paper-200)"><b>go</b><i>forest</i></div></div></body></html>
