<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{width:700px;height:120px;overflow:hidden}body{padding:20px 22px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:7px 8px}.sw b{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;display:block}.sw i{font-family:var(--font-body);font-style:normal;font-size:10px;letter-spacing:.02em;opacity:.75;display:block;margin-top:2px}</style></head><body><div class="row"><div class="sw" style="background:var(--pigment-yellow);color:var(--ink-900)"><b>saffron</b><i>#C0A860</i></div><div class="sw" style="background:var(--pigment-ochre);color:var(--paper-200)"><b>ochre</b><i>#907848</i></div><div class="sw" style="background:var(--pigment-umber);color:var(--paper-200)"><b>carob</b><i>#6B4426</i></div><div class="sw" style="background:var(--pigment-olive);color:var(--ink-900)"><b>olive</b><i>#5F7A46</i></div><div class="sw" style="background:var(--pigment-forest);color:var(--paper-200)"><b>cypress</b><i>#34513C</i></div></div></body></html>
