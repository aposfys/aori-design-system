<!-- @dsCard group="Colors" viewport="700x120" name="Two seas" subtitle="Libyan south, Aegean north" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{width:700px;height:120px;overflow:hidden}body{padding:20px 22px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:7px 8px}.sw b{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;display:block}.sw i{font-family:var(--font-body);font-style:normal;font-size:10px;letter-spacing:.02em;opacity:.75;display:block;margin-top:2px}</style></head><body><div class="row"><div class="sw" style="background:var(--pigment-teal);color:var(--paper-200)"><b>shallow</b><i>#1890A8</i></div><div class="sw" style="background:var(--pigment-water);color:var(--paper-200)"><b>open sea</b><i>#006078</i></div><div class="sw" style="background:var(--pigment-sky);color:var(--ink-900)"><b>haze</b><i>#A8C0C0</i></div><div class="sw" style="background:var(--pigment-slate);color:var(--ink-900)"><b>limestone</b><i>#A8A890</i></div><div class="sw" style="background:var(--pigment-ultramarine);color:var(--paper-200)"><b>aegean deep</b><i>#006078</i></div></div></body></html>
