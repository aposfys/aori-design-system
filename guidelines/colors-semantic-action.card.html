<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{width:700px;height:150px;overflow:hidden}body{padding:20px 22px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:7px 8px}.sw b{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;display:block}.sw i{font-family:var(--font-body);font-style:normal;font-size:10px;letter-spacing:.02em;opacity:.75;display:block;margin-top:2px}</style></head><body><div class="row"><div class="sw" style="background:var(--accent);color:var(--paper-200)"><b>accent</b><i>terracotta, deep cut</i></div><div class="sw" style="background:var(--accent-hover);color:var(--paper-200)"><b>accent-hover</b><i>one step deeper</i></div><div class="sw" style="background:var(--accent-press);color:var(--paper-200)"><b>accent-press</b><i>rust</i></div><div class="sw" style="background:var(--accent-quiet);color:var(--paper-200)"><b>accent-quiet</b><i>clay</i></div><div class="sw" style="background:var(--focus-ring);color:var(--paper-200)"><b>focus-ring</b><i>deep water</i></div></div>
<p style="font:var(--type-annotation-sm);letter-spacing:var(--tracking-annotation);text-transform:uppercase;margin:12px 0 0;max-width:none">ULTRAMARINE IS NEVER A BACKGROUND FIELD, SO A FOCUS RING CAN NEVER BE LOST AGAINST THE WORK.</p></body></html>
