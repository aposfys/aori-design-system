<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{width:700px;height:150px;overflow:hidden}body{padding:20px 22px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:7px 8px}.sw b{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;display:block}.sw i{font-family:var(--font-body);font-style:normal;font-size:10px;letter-spacing:.02em;opacity:.75;display:block;margin-top:2px}</style></head><body><div style="display:grid;gap:9px">
<div style="display:flex;align-items:center;gap:14px"><span style="font:var(--type-form-label);color:var(--text-muted);width:88px;flex:none">dur-instant</span><div style="height:6px;background:var(--pigment-pink);width:48px"></div><span style="font:var(--type-form-label);color:var(--text-faint)">80ms</span></div><div style="display:flex;align-items:center;gap:14px"><span style="font:var(--type-form-label);color:var(--text-muted);width:88px;flex:none">dur-fast</span><div style="height:6px;background:var(--pigment-pink);width:84px"></div><span style="font:var(--type-form-label);color:var(--text-faint)">140ms</span></div><div style="display:flex;align-items:center;gap:14px"><span style="font:var(--type-form-label);color:var(--text-muted);width:88px;flex:none">dur-base</span><div style="height:6px;background:var(--pigment-pink);width:132px"></div><span style="font:var(--type-form-label);color:var(--text-faint)">220ms</span></div><div style="display:flex;align-items:center;gap:14px"><span style="font:var(--type-form-label);color:var(--text-muted);width:88px;flex:none">dur-slow</span><div style="height:6px;background:var(--pigment-pink);width:252px"></div><span style="font:var(--type-form-label);color:var(--text-faint)">420ms</span></div><div style="display:flex;align-items:center;gap:14px"><span style="font:var(--type-form-label);color:var(--text-muted);width:88px;flex:none">dur-page</span><div style="height:6px;background:var(--pigment-pink);width:420px"></div><span style="font:var(--type-form-label);color:var(--text-faint)">700ms</span></div>
<div style="font:var(--type-form-label);color:var(--text-muted);margin-top:2px">ease-standard &middot; cubic-bezier(.2,0,.2,1)</div>
</div></body></html>
