<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Navigation</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:22px 24px}
.cap{font:var(--type-annotation-sm);letter-spacing:var(--tracking-annotation);text-transform:uppercase;color:var(--text-muted)}
a{color:var(--link)}a:hover{color:var(--link-hover)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../lib/ds-bundle.js"></script>
<style>body{padding:0}.pad{padding:18px 24px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { NavBar, Tabs, Button } = window.AORIDesignSystem_12e58c;
const items=[{label:'Collections'},{label:'The workshop'},{label:'Journal'},{label:'Stockists'}];
function Demo(){
  const [page,setPage]=React.useState('Collections');
  const [tab,setTab]=React.useState('Description');
  const [filter,setFilter]=React.useState('All');
  return (<div>
    <NavBar items={items} active={page} onSelect={setPage} sticky={false}
      right={<Button variant="quiet" size="sm">Basket · 2</Button>} />
    <div className="pad" style={{display:'grid',gap:8}}>
      <span className="cap">Active takes a 2px terracotta underline</span>
    </div>
    <NavBar items={items} active={page} onSelect={setPage} sticky={false} ground="ground"
      right={<span style={{font:'var(--type-ui)',letterSpacing:'var(--tracking-annotation)',textTransform:'uppercase',color:'var(--paper-400)'}}>Basket · 2</span>} />
    <div className="pad" style={{display:'grid',gap:20}}>
      <span className="cap">On burnt olive the underline turns saffron — terracotta goes muddy on dark</span>
      <div style={{display:'grid',gap:9}}>
        <Tabs items={[{label:'Description'},{label:'Materials'},{label:'Care',count:3},{label:'Shipping'}]} value={tab} onChange={setTab} />
        <span className="cap">Product detail · md</span>
      </div>
      <div style={{display:'grid',gap:9}}>
        <Tabs size="sm" pigment="var(--pigment-aegean)" items={[{label:'All',count:24},{label:'Rings',count:9},{label:'Hoops',count:7},{label:'Chains',count:8}]} value={filter} onChange={setFilter} />
        <span className="cap">Collection filter · sm, aegean fill</span>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
