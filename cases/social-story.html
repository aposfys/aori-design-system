<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AORI — case: Instagram story 1080×1920</title><link rel="stylesheet" href="../styles.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden;margin:0}
body{background:var(--pigment-aegean);font-family:var(--font-body);color:var(--paper-200);display:flex;flex-direction:column;padding:96px 84px;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{width:210px}
.kick{font-family:var(--font-annotation);font-weight:600;font-size:23px;letter-spacing:.15em;text-transform:uppercase}
.plate{margin:88px 0 0;background:var(--stock-100);padding:26px;align-self:center}
.plate img{width:660px;display:block;border:5px solid var(--stock-100);outline:1px solid rgba(42,38,34,.18)}
.count{margin-top:96px;text-align:center}
.count .n{font-family:var(--font-display);font-size:230px;line-height:.9;letter-spacing:.04em;color:var(--paper-100)}
.count .of{font-family:var(--font-annotation);font-weight:600;font-size:27px;letter-spacing:.16em;text-transform:uppercase;margin-top:26px}
.dots{display:flex;gap:18px;justify-content:center;margin-top:56px}
.dots span{width:34px;height:34px;background:var(--paper-200)}
.dots span.gone{background:transparent;box-shadow:inset 0 0 0 3px rgba(251,247,239,.55)}
.foot{margin-top:auto;text-align:center;font-family:var(--font-annotation);font-weight:600;font-size:22px;letter-spacing:.13em;text-transform:uppercase;border-top:2px solid var(--paper-200);padding-top:34px}
</style></head><body>
<div class="top"><span class="kick">Run · Livyko</span><img src="../assets/logos/wordmark-paper.svg" alt="AORI"></div>
<div class="plate"><img src="../assets/illustrations-v2-web/sun-sea.jpg" alt=""></div>
<div class="count">
  <div class="n">Four</div>
  <div class="of">left of twelve</div>
  <div class="dots">
    <span class="gone"></span><span class="gone"></span><span class="gone"></span><span class="gone"></span><span class="gone"></span><span class="gone"></span><span class="gone"></span><span class="gone"></span>
    <span></span><span></span><span></span><span></span>
  </div>
</div>
<div class="foot">When they are gone we make something else</div>
</body></html>
