<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AORI — case: Instagram post 1080</title><link rel="stylesheet" href="../styles.css">
<style>
html,body{width:1080px;height:1080px;overflow:hidden;margin:0}
body{background:var(--paper-200);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column}
.paint{height:640px;background:url('../assets/illustrations-v2-web/livyko.jpg') center 38%/cover;border-bottom:4px solid var(--ink-900)}
.plate{flex:1;padding:54px 64px 0;display:flex;flex-direction:column}
.kick{font-family:var(--font-annotation);font-weight:600;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--pigment-terracotta)}
h1{margin:18px 0 0;font-family:var(--font-display);font-size:96px;letter-spacing:.1em;text-transform:uppercase;font-weight:400;line-height:.98}
.sub{margin-top:22px;font-size:30px;line-height:1.5;max-width:30ch}
.foot{margin-top:auto;padding:0 0 46px;display:flex;align-items:flex-end;justify-content:space-between;border-top:2px solid var(--ink-900);padding-top:26px}
.nums{font-family:var(--font-annotation);font-weight:600;font-size:21px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-700)}
.nums b{color:var(--ink-900)}
.foot img{width:190px}
</style></head><body>
<div class="paint"></div>
<div class="plate">
  <div class="kick">New run · Named for the south coast</div>
  <h1>Livyko</h1>
  <p class="sub">Hammered on the bench and left matte. Named for the beach below the village, where the water goes flat at six in the evening.</p>
  <div class="foot">
    <div class="nums"><b>Twelve made</b> · Silver 925 · Heraklion</div>
    <img src="../assets/logos/wordmark-ink.svg" alt="AORI">
  </div>
</div>
</body></html>
