<!-- @dsCard group="Storefront" viewport="1280x820" name="Storefront" subtitle="Home and product page, click-through" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AORI — storefront</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-body);font-family:var(--font-body)}a{color:var(--link)}a:hover{color:var(--link-hover)}#root{min-height:100vh}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../lib/ds-bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="StorefrontHome.jsx"></script>
<script type="text/babel" src="Product.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState('home');
  const [openId,setOpenId]=React.useState(PIECES[0].id);
  const [basket,setBasket]=React.useState([]);
  const piece=PIECES.find(p=>p.id===openId);
  const open=id=>{setOpenId(id);setPage('product');window.scrollTo(0,0)};
  return (<div>
    <Nav page={page==='product'?'product':page} onNav={p=>{setPage(p==='product'?'product':'home');window.scrollTo(0,0)}} basket={basket.length} />
    {page==='product'
      ? <Product piece={piece} all={PIECES} onOpen={open} inBasket={basket.includes(piece.id)} onAdd={()=>setBasket(b=>b.includes(piece.id)?b:[...b,piece.id])} />
      : <StorefrontHome onOpen={open} />}
    <div style={{marginTop:52}}><Footer /></div>
  </div>);
}
const boot=()=>{ if(window.StorefrontHome&&window.Nav&&window.Product){ReactDOM.createRoot(document.getElementById('root')).render(<App/>)} else setTimeout(boot,40) };
boot();
</script>
</body></html>
